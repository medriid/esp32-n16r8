[platformio]
default_envs = esp32-s3-n16r8

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7

; Default laptop workflow: build here, then securely sync the project to the
; homelab and let the homelab flash the USB-connected ESP32-S3.
[env:esp32-s3-n16r8]
upload_protocol = custom
upload_command = bash scripts/remote_upload.sh

; Used only on mdebian-homelab after the project has been synchronized.
[env:esp32-s3-n16r8-homelab]
upload_protocol = esptool
upload_port = /dev/serial/by-id/usb-1a86_USB_Single_Serial_5C38119516-if00
